language = "C"
include_guard = "RIMURU_H"
pragma_once = false
header = "/* Generated by cbindgen 0.29.4 from the frozen Rimuru C ABI 1.0. Do not edit. */"
tab_width = 4
documentation = true
documentation_style = "c99"
usize_is_size_t = true
cpp_compat = true
no_includes = false

trailer = '''
#if defined(__cplusplus)
static_assert(sizeof(RmStatus) == 4, "RmStatus is a 32-bit enum");
static_assert(sizeof(RmEventKind) == 4, "RmEventKind is a 32-bit enum");
static_assert(sizeof(RmTicketState) == 4, "RmTicketState is a 32-bit enum");
static_assert(sizeof(RmWaitSourceKind) == 4, "RmWaitSourceKind is a 32-bit enum");
static_assert(sizeof(RmBackend) == 4, "RmBackend is a 32-bit enum");
static_assert(sizeof(RmHandle) == sizeof(void *), "RmHandle is pointer-width");
#elif defined(__STDC_VERSION__) && __STDC_VERSION__ >= 201112L
_Static_assert(sizeof(RmStatus) == 4, "RmStatus is a 32-bit enum");
_Static_assert(sizeof(RmEventKind) == 4, "RmEventKind is a 32-bit enum");
_Static_assert(sizeof(RmTicketState) == 4, "RmTicketState is a 32-bit enum");
_Static_assert(sizeof(RmWaitSourceKind) == 4, "RmWaitSourceKind is a 32-bit enum");
_Static_assert(sizeof(RmBackend) == 4, "RmBackend is a 32-bit enum");
_Static_assert(sizeof(RmHandle) == sizeof(void *), "RmHandle is pointer-width");
#endif
'''

[parse]
parse_deps = false
clean = false

[export]
include = ["Rm[A-Za-z0-9_]*", "rm_[a-z0-9_]*"]
exclude = []
item_types = ["functions", "structs", "enums", "constants", "typedefs"]

[fn]
args = "horizontal"
sort_by = "Name"

[struct]
derive_eq = false
derive_neq = false
